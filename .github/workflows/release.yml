name: Build & Release

on:
  push:
    tags:
      - "v*"
    branches:
      - "claude/yousician-alternative-vshoiv"
      - "main"
      # Every working branch too. aubio has shipped no wheel since 2019, so a
      # machine without the MSVC toolchain cannot install it at all -- and the
      # player has now hit exactly that on a second computer. This runner has
      # the compiler, so the build it produces is the way to run the current
      # code there without installing 2 GB of Visual Studio first.
      - "claude/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Stamp the build
        # Without this the EXE reports "unknown build", and "is it fixed" and
        # "did it reach the machine" become the same question. Every EXE this
        # workflow produced before this step said exactly that, and a player
        # was asked to verify a commit his log could not name.
        run: python tools/stamp_build.py

      # ffmpeg is deliberately NOT bundled -- it is 37 MB of the EXE, and it
      # serves one feature that does not currently work: YouTube's bot check
      # killed the audio half of the download, so the recording is picked by
      # hand. When it works again, `_search_folders` finds an ffmpeg.exe
      # dropped BESIDE MySician.exe with no rebuild at all, which is exactly
      # what the download screen already tells the player to do. Run
      # `python tools/fetch_ffmpeg.py` before PyInstaller to bundle one; the
      # spec picks up tools/ffmpeg* whenever it is there.

      - name: Build exe
        run: pyinstaller pickhero.spec --noconfirm

      - name: Verify verovio can engrave in this environment
        # Necessary and NOT sufficient -- see the EXE check below, which is
        # the one that answers the packaging question.
        run: python tools/check_verovio.py

      - name: Verify build output
        run: |
          if (!(Test-Path "dist\MySician.exe")) {
            Write-Error "MySician.exe not found in dist/"
            exit 1
          }
          $size = (Get-Item "dist\MySician.exe").Length / 1MB
          Write-Host "MySician.exe size: $([math]::Round($size, 1)) MB"
        shell: pwsh

      - name: Verify the EXE itself can engrave
        # The build step above passed while the EXE it produced had no
        # verovio in it at all: every import of it is inside a function, so
        # nothing in the static import graph reached it. A check that runs
        # beside the package cannot answer a question about the package.
        run: .\dist\MySician.exe --check-engraver
        shell: pwsh

      - name: Upload exe as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: MySician
          path: dist/MySician.exe

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/MySician.exe
          generate_release_notes: true
