name: Build & Release

on:
  push:
    tags:
      - "v*"
    branches:
      - "claude/yousician-alternative-vshoiv"
      - "main"
      # Every working branch too. aubio has shipped no wheel since 2019, so a
      # machine without the MSVC toolchain cannot install it at all -- and the
      # player has now hit exactly that on a second computer. This runner has
      # the compiler, so the build it produces is the way to run the current
      # code there without installing 2 GB of Visual Studio first.
      - "claude/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build exe
        run: pyinstaller pickhero.spec --noconfirm

      - name: Verify build output
        run: |
          if (!(Test-Path "dist\MySician.exe")) {
            Write-Error "MySician.exe not found in dist/"
            exit 1
          }
          $size = (Get-Item "dist\MySician.exe").Length / 1MB
          Write-Host "MySician.exe size: $([math]::Round($size, 1)) MB"
        shell: pwsh

      - name: Upload exe as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: MySician
          path: dist/MySician.exe

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/MySician.exe
          generate_release_notes: true
